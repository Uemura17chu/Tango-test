<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三単現トレーニングシステム</title>
<style>
:root{--bg:#fbf7ff;--text:#2e2a40;--muted:#6b6584;--line:#e4dcf2;
--lav:#e9e1ff;--lav-dk:#7b61c9;--mint:#dff6ea;--mint-dk:#2f8f5b;--peach:#ffe6d9;--peach-dk:#c46a3c;
--sky:#dff0ff;--sky-dk:#3b7cc4;--pink:#ffe3ee;--pink-dk:#c2457a;--lemon:#fff6cc;--lemon-dk:#a8860c;
--ok:#2f8f5b;--ng:#c2414b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;
background:radial-gradient(circle at 10% 0%,#ffe9f3 0,transparent 40%),radial-gradient(circle at 95% 10%,#e3f3ff 0,transparent 40%),radial-gradient(circle at 50% 100%,#e6f9ee 0,transparent 45%),var(--bg);background-attachment:fixed}
.wrap{max-width:1000px;margin:auto;padding:16px 14px 40px}
.panel{background:#fff;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 5px 0 var(--line),0 12px 28px rgba(123,97,201,.10)}
h1{font-size:1.6rem;margin:0 0 6px;color:var(--lav-dk)}
h2{font-size:1.3rem;margin:0 0 12px;color:var(--lav-dk)}
.muted{color:var(--muted)} #training .muted{font-size:1.02rem;line-height:1.55}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label{font-weight:700}input,button{font:inherit}
button{border:0;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer;transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:none!important}
button:focus-visible{outline:4px solid #b9a6ff;outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--lav-dk);color:#fff;box-shadow:0 4px 0 #5a45a0}
.secondary{background:var(--lemon);color:#6b5400;box-shadow:0 4px 0 #ecd77a}
.hidden{display:none!important}

/* ===== 出席番号ゲート（大きく・タップしやすく） ===== */
#gate{min-height:calc(100vh - 32px);display:flex;flex-direction:column;padding:26px 24px 0}
#gate h1{font-size:clamp(1.7rem,4vw,2.4rem);text-align:center;margin-bottom:4px}
.gateLead{text-align:center;font-size:1.15rem;color:var(--muted);margin-bottom:18px}
.step{font-size:1.25rem;font-weight:900;margin:14px 0 10px;color:var(--text)}
.step span{display:inline-block;background:var(--lav);color:var(--lav-dk);border-radius:999px;padding:2px 14px;margin-right:8px}
.classGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.numGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:9px}
.pickBtn{min-height:64px;font-size:1.45rem;background:#fff;color:var(--text);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);padding:6px 0}
.classGrid .pickBtn{min-height:76px;font-size:1.6rem}
.classGrid .pickBtn:nth-child(7n+1){background:var(--pink)}.classGrid .pickBtn:nth-child(7n+2){background:var(--peach)}
.classGrid .pickBtn:nth-child(7n+3){background:var(--lemon)}.classGrid .pickBtn:nth-child(7n+4){background:var(--mint)}
.classGrid .pickBtn:nth-child(7n+5){background:var(--sky)}.classGrid .pickBtn:nth-child(7n+6){background:var(--lav)}
.classGrid .pickBtn:nth-child(7n+7){background:#f1e6ff}
.numGrid .pickBtn:hover,.classGrid .pickBtn:hover{border-color:#b9a6ff}
.pickBtn.sel{background:var(--lav-dk)!important;color:#fff;border-color:#5a45a0;box-shadow:0 4px 0 #5a45a0}
.gateBar{position:sticky;bottom:0;margin:20px -24px 0;padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));background:#fff;border-top:3px solid var(--lav);display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#gateWho{font-size:1.6rem;font-weight:900;color:var(--lav-dk)}
#gateWho.empty{font-size:1.15rem;color:var(--muted);font-weight:700}
#enterBtn{font-size:1.35rem;padding:16px 30px;background:var(--mint-dk);box-shadow:0 5px 0 #1f6a42}

/* ===== Level選択 ===== */
#levelPanel{border-top:10px solid var(--lav)}
.whoBar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.whoTag{font-size:1.35rem;font-weight:900;background:var(--lav);color:var(--lav-dk);border-radius:999px;padding:6px 20px}
#changeNo{font-size:.95rem;padding:8px 14px}
.levels{display:grid;grid-template-columns:repeat(10,1fr);gap:9px}
.level{min-height:60px;font-size:1.35rem;background:var(--lvbg);color:var(--lv);border:3px solid var(--lvln);box-shadow:0 4px 0 var(--lvln);padding:4px 0}
.level.active{background:var(--lv);color:#fff;border-color:var(--lv)}
[data-band="1"]{--lv:#2f8f5b;--lvbg:#e3f7ec;--lvln:#a8dfc0}
[data-band="2"]{--lv:#3b7cc4;--lvbg:#e2f0ff;--lvln:#a9cdf2}
[data-band="3"]{--lv:#7b61c9;--lvbg:#eee8ff;--lvln:#c8b9f2}
[data-band="4"]{--lv:#c46a3c;--lvbg:#ffeadf;--lvln:#f3c2a5}
[data-band="5"]{--lv:#c2457a;--lvbg:#ffe6f0;--lvln:#f2b3cd}
[data-band="6"]{--lv:#a8860c;--lvbg:#fff6cc;--lvln:#ecd77a}

/* ===== 問題画面 ===== */
#training{border-top:10px solid var(--lvln,var(--lav))}
#levelTitle{display:inline-block;background:var(--lv,var(--lav-dk));color:#fff;padding:5px 18px;border-radius:999px;font-size:1.3rem}
#levelNote{background:var(--lvbg,var(--lav));border-radius:12px;padding:8px 14px;margin-top:4px;color:#3d3756}
.q{padding:16px 18px;margin:14px 0;border-radius:18px;font-size:1.22rem;line-height:1.7;background:var(--sky);border:2px solid #c3dff7}
.q.q-writing{background:var(--peach);border-color:#f3c9b0}
.qnum{display:inline-block;font-weight:900;margin-bottom:8px;font-size:1.05rem;color:#fff;background:var(--sky-dk);padding:2px 14px;border-radius:999px}
.q.q-writing .qnum{background:var(--peach-dk)}
.q>div:not(.qnum):not(.choices):not(.answer):not(.caseBar):not(.wRow){font-size:1.32rem;font-weight:700}
.q.q-writing>.muted{font-size:1rem!important;font-weight:600!important;color:#8a4f2c}
.choices{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.choice{display:inline-block;border:3px solid #c3dff7;border-radius:14px;padding:11px 18px;font-size:1.28rem;font-weight:750;background:#fff;min-width:110px;cursor:pointer;box-shadow:0 3px 0 #c3dff7}
.choice:has(input:checked){background:var(--sky-dk);color:#fff;border-color:#2c629f;box-shadow:0 3px 0 #2c629f}
.choice input{transform:scale(1.35);margin-right:7px}
.answer{margin-top:14px;background:var(--lemon);border:3px solid #ecd77a;padding:15px 16px;border-radius:14px;font-size:1.38rem;line-height:1.7;font-weight:700}
.answer .choice{font-size:1.1rem;border-color:#ecd77a;box-shadow:0 3px 0 #ecd77a;margin-top:6px}
.answer .choice:has(input[value="same"]:checked){background:var(--mint-dk);border-color:#1f6a42;box-shadow:0 3px 0 #1f6a42;color:#fff}
.answer .choice:has(input[value="fixed"]:checked){background:var(--pink-dk);border-color:#963260;box-shadow:0 3px 0 #963260;color:#fff}
.ok{color:var(--ok);font-weight:900}.ng{color:var(--ng);font-weight:900}
[id^="f"]{font-size:1.15rem;margin-top:10px;font-weight:800}
[id^="f"].ok{display:inline-block;background:var(--mint);padding:4px 14px;border-radius:10px}
[id^="f"].ng{display:inline-block;background:var(--pink);padding:4px 14px;border-radius:10px}
#gradeChoices{background:var(--sky-dk);box-shadow:0 4px 0 #2c629f}
.caseBar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.caseLbl{font-size:.95rem;font-weight:800;color:#8a4f2c}
.caseBtn{background:#fff;color:var(--text);border:3px solid #f3c9b0;box-shadow:0 3px 0 #f3c9b0;padding:9px 14px;font-size:1.05rem}
.caseBtn.on{background:var(--peach-dk);color:#fff;border-color:#964f2a;box-shadow:0 3px 0 #964f2a}
.wIn{display:block;width:100%;margin-top:10px;font-size:1.4rem;padding:12px 14px;border:3px solid #f3c9b0;border-radius:14px;background:#fff;color:var(--text);font-family:"Segoe UI",Arial,sans-serif}
.wIn:focus{outline:4px solid #b9a6ff;outline-offset:1px}
.wIn[readonly]{background:#f2fbf6;border-color:#a8dfc0}
.wRow{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.checkBtn{background:var(--peach-dk);color:#fff;box-shadow:0 4px 0 #964f2a;font-size:1.15rem}
.giveUp{font-size:.95rem;padding:10px 14px}
.wfb{font-size:1.12rem;margin-top:10px;font-weight:800;line-height:1.6}
.wfb.ok{display:block;background:var(--mint);padding:6px 14px;border-radius:10px}
.wfb.ng{display:block;background:var(--pink);padding:6px 14px;border-radius:10px}
.answer{user-select:none;-webkit-user-select:none}
.yours{font-size:1rem;color:var(--ng);margin-top:6px;font-weight:700}
#score{font-size:1.25rem;line-height:1.6}
#score:not(:empty){background:var(--lav);border-radius:14px;padding:12px 16px;margin-top:14px}
#lockMsg{background:#f4f1fa;border-radius:12px;padding:8px 14px}

/* ===== クリア画面 ===== */
#passPanel{background:linear-gradient(135deg,#fff0f6,#fff9db 50%,#e6f9ee);border-top:10px solid #f7c6dc}
.pass{text-align:center;padding:6px}
.pass>.ok:first-child{display:inline-block;background:var(--pink-dk);color:#fff;font-size:1.7rem;padding:6px 34px;border-radius:999px;margin-bottom:10px;letter-spacing:.1em}
#passLv{font-size:1.15rem;font-weight:800;color:var(--muted);margin-top:12px}
.word{display:inline-block;font-size:clamp(3rem,10vw,4.6rem);font-weight:900;letter-spacing:.12em;margin:10px auto 14px;color:var(--lav-dk);background:#fff;border:4px dashed #c8b9f2;border-radius:22px;padding:12px 34px;min-width:220px}
.progBox{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:16px;border:3px solid var(--lav)}
.progHead{font-weight:900;color:var(--lav-dk);font-size:1.1rem;margin-top:6px}
.progBar{height:16px;background:#f1edf9;border-radius:999px;overflow:hidden;margin:8px 0 4px}
.progFill{height:100%;width:0;background:linear-gradient(90deg,#a8dfc0,#a9cdf2,#c8b9f2,#f3c2a5,#f2b3cd,#ecd77a);border-radius:999px;transition:width .4s}
.progNum{font-weight:800;color:var(--muted)}
.progMsg{margin-top:8px;font-size:1.3rem;line-height:2;letter-spacing:.08em;font-weight:800;color:var(--text);word-break:break-all;line-break:anywhere;overflow-wrap:anywhere;text-align:left}
.progMsg .hide{color:#d6cfe6}
.level.locked{background:#f3f1f7;color:#c3bdd2;border-color:#e6e2ee;box-shadow:0 4px 0 #e6e2ee;cursor:not-allowed}
.level.locked::before{content:"🔒";font-size:.8rem;display:block;line-height:1}
.level.done{position:relative}
.level.done::after{content:"✓";position:absolute;top:2px;right:6px;font-size:.85rem}
.level.next{outline:4px solid #f7c6dc;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.progFill{transition:none}}

@media(max-width:700px){
 .classGrid{grid-template-columns:repeat(4,1fr)}
 .numGrid{grid-template-columns:repeat(5,1fr)}
 .levels{grid-template-columns:repeat(5,1fr)}
 .wrap{padding:10px 8px 30px}#gate{padding:20px 14px 0}.gateBar{margin:16px -14px 0;padding-left:14px;padding-right:14px}
 #enterBtn{width:100%}#gate h1{font-size:1.45rem}.gateLead{font-size:1rem}
 .q{font-size:1.16rem;padding:14px}.q>div:not(.qnum):not(.choices):not(.answer):not(.caseBar):not(.wRow){font-size:1.23rem}
 .caseBtn{font-size:.95rem;padding:9px 10px}
 .choice{font-size:1.18rem;min-width:100px}.answer{font-size:1.25rem}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<section id="gate" class="panel">
<h1>三単現トレーニングシステム</h1>
<div class="gateLead">自分の組と出席番号をタップしてください。</div>
<input type="hidden" id="classNo" value=""><input type="hidden" id="studentNo" value="">
<div class="step"><span>1</span>組をえらぶ</div>
<div id="classGrid" class="classGrid"></div>
<div class="step"><span>2</span>出席番号をえらぶ</div>
<div id="numGrid" class="numGrid"></div>
<div class="gateBar"><div id="gateWho" class="empty">まだ選ばれていません</div><button id="enterBtn" class="primary" disabled>この出席番号で入る</button></div>
</section>
<section id="levelPanel" class="panel hidden"><div class="whoBar"><div id="whoTag" class="whoTag"></div><button id="changeNo" class="secondary" type="button">出席番号を選びなおす</button></div><div class="progBox"><div class="progHead">メッセージの完成まで</div><div class="progBar"><div class="progFill"></div></div><div class="progNum"></div><div class="progMsg"></div></div><h2>Levelを選ぶ</h2><div id="levels" class="levels"></div></section>
<section id="training" class="panel hidden">
<div class="row" style="justify-content:space-between"><div><h2 id="levelTitle"></h2><div id="levelNote" class="muted"></div></div></div>
<div id="questions"></div>
<div class="row"><button id="gradeChoices" class="primary">選択問題を採点</button></div>
<div id="score" style="margin-top:12px"></div><div id="lockMsg" class="muted" style="margin-top:8px"></div><button id="backToLevels" class="secondary hidden" style="margin-top:12px">Level選択へ戻る</button>
</section>
<section id="passPanel" class="panel hidden">
<div class="pass">
<div class="ok">クリア</div><div>クリアもじをB4のクリアもじシートに書いてください。</div><div id="passLv"></div>
<div id="passWord" class="word"></div>
<div class="progHead">メッセージの完成まで</div><div class="progBar"><div class="progFill"></div></div><div class="progNum"></div><div class="progMsg"></div>
</div></section>
</div>
<script>
(()=>{

};

function build(){
 choiceScore=null;marks=[null,null,null];const kinds=planKinds(current);qs=[choiceQ(current,kinds[0]),choiceQ(current,kinds[1])];
 const pats=[true,true,false].sort(()=>Math.random()-.5);pats.forEach((x,j)=>qs.push({...makeSentence(current,x,kinds[2+j]),type:"writing"}));
 document.getElementById("training").dataset.band=band(current);document.getElementById("levelTitle").textContent="Level "+current;document.getElementById("levelNote").textContent=note(current);
 const box=document.getElementById("questions");box.innerHTML="";
 qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q q-"+q.type;d.innerHTML='<div class="qnum">Q'+(i+1)+'</div>';
 if(q.type==="choice"){const p=document.createElement("div");p.textContent=q.prompt;d.appendChild(p);const c=document.createElement("div");c.className="choices";q.opts.forEach(o=>{const l=document.createElement("label");l.className="choice";l.innerHTML='<input type="radio" name="q'+i+'" value="'+o+'"> '+o;c.appendChild(l)});d.appendChild(c);const f=document.createElement("div");f.id="f"+i;d.appendChild(f)}
 else buildWriting(d,q,i);box.appendChild(d)});
 caseMode="lower";oneShot=false;wst={2:"try",3:"try",4:"try"};refreshCaseBtns();
 document.getElementById("score").innerHTML="";
 document.getElementById("lockMsg").textContent="このLevelは、5問を最後まで終えるまで別のLevelへ移れません。";
 document.getElementById("backToLevels").classList.add("hidden");
 document.getElementById("passPanel").classList.add("hidden");
 document.getElementById("training").classList.remove("hidden");
 window.scrollTo(0,0);
}
// ===== 英作文：打ちこみ＆チェック =====
let caseMode="lower",oneShot=false,capsKey=false,shiftKey=false,wst={};
function refreshCaseBtns(){document.querySelectorAll(".caseBtn").forEach(b=>{const m=b.dataset.mode;b.classList.toggle("on",m==="one"?oneShot:(m===caseMode))})}
function caseOf(ch){
 if(!/[A-Za-z]/.test(ch))return ch;
 let up;
 if(oneShot){up=true;oneShot=false}
 else if(caseMode==="upper")up=true;
 else if(capsKey)up=shiftKey;            // Caps Lockが入っていても、ふつうは小文字・Shiftで大文字
 else return ch;
 return up?ch.toUpperCase():ch.toLowerCase();
}
function applyCase(inp){
 const nv=inp.value,pv=inp.dataset.prev||"";
 if(nv!==pv){
   let a=0;while(a<pv.length&&a<nv.length&&pv[a]===nv[a])a++;
   let b=0;while(b<pv.length-a&&b<nv.length-a&&pv[pv.length-1-b]===nv[nv.length-1-b])b++;
   const ins=nv.slice(a,nv.length-b);
   if(ins){const out=[...ins].map(caseOf).join("");
     if(out!==ins){inp.value=nv.slice(0,a)+out+nv.slice(nv.length-b);const c=a+out.length;try{inp.setSelectionRange(c,c)}catch(e){}}}
 }
 inp.dataset.prev=inp.value;refreshCaseBtns();
}
function perms(a){if(a.length<=1)return [a];const r=[];a.forEach((x,i)=>perms(a.slice(0,i).concat(a.slice(i+1))).forEach(p=>r.push([x].concat(p))));return r}
// 日本語では数が決まらない目的語は、単数・複数どちらでも正解にする（例：本を読みます → books / a book）
// 「好きです」（like dogs）など、どちらかしか正しくないものは入れない
const NUM_ALT={
 "read|books":["a book"],
 "use|a computer":["computers"],
 "use|a dictionary":["dictionaries"],
 "watch|movies":["a movie"],
 "watch|baseball games":["a baseball game"],
 "have|a dog":["dogs"],
 "have|a bike":["bikes"],
 "write|a letter":["letters"],
 "carry|a big bag":["big bags"],
 "carry|the boxes":["the box"],
 "buy|a new bag":["new bags"],
 "buy|flowers":["a flower"]
};
function answersOf(q){
 const xs=q.toks.filter(x=>x.r==="x").map(x=>x.t),base=q.toks.filter(x=>x.r!=="x").map(x=>x.t);
 const heads=[base],alt=q.v&&NUM_ALT[q.v.b+"|"+q.obj];
 if(alt){const oi=q.toks.filter(x=>x.r!=="x").findIndex(x=>x.r===undefined&&x.t===q.obj);
   if(oi>=0)alt.forEach(a=>{const h=base.slice();h[oi]=a;heads.push(h)})}
 const out=[];heads.forEach(h=>perms(xs).forEach(p=>out.push(h.concat(p).join(" ")+q.end)));return out}
function canon(t){return t.replace(/[‘’`´]/g,"'").replace(/\s+/g," ").replace(/\s+([.,?!])/g,"$1").trim()
 .replace(/\bdoesn't\b/g,"does not").replace(/\bdon't\b/g,"do not").replace(/\bcan't\b/g,"cannot")}
function judge(val,q){
 const c=canon(val),A=answersOf(q).map(canon),strip=t=>t.replace(/[.?!]+$/,"");
 if(A.includes(c))return "ok";
 if(A.some(a=>a.toLowerCase()===c.toLowerCase()))return "case";
 if(A.some(a=>strip(a)===strip(c)))return "punct";
 if(A.some(a=>strip(a).toLowerCase()===strip(c).toLowerCase()))return "both";
 return "ng";
}
const HINT={case:"大文字・小文字がちがうところがあります。",punct:"文の最後の「.」や「?」を確認しよう。",both:"大文字・小文字と、文の最後の「.」「?」を確認しよう。",ng:""};
function buildWriting(d,q,i){
 const p=document.createElement("div");p.textContent=q.jp;d.appendChild(p);
 const h=document.createElement("div");h.className="muted";h.textContent="英語で打ちこんで「チェック」を押そう。";d.appendChild(h);
 const bar=document.createElement("div");bar.className="caseBar";
 bar.innerHTML='<span class="caseLbl">入力：</span><button type="button" class="caseBtn" data-mode="lower">abc 小文字</button><button type="button" class="caseBtn" data-mode="upper">ABC 大文字</button><button type="button" class="caseBtn" data-mode="one">A 次の1文字だけ大文字</button>';
 d.appendChild(bar);
 const inp=document.createElement("input");inp.type="text";inp.id="w"+i;inp.className="wIn";inp.lang="en";
 ["autocomplete","autocorrect","autocapitalize"].forEach(a=>inp.setAttribute(a,"off"));inp.spellcheck=false;
 inp.placeholder="ここに英文を打ちこむ";d.appendChild(inp);
 const row=document.createElement("div");row.className="wRow";
 const ck=document.createElement("button");ck.type="button";ck.className="checkBtn";ck.textContent="チェック";
 const gu=document.createElement("button");gu.type="button";gu.className="secondary giveUp";gu.textContent="わからない（答えを見る）";
 row.appendChild(ck);row.appendChild(gu);d.appendChild(row);
 const fb=document.createElement("div");fb.className="wfb";fb.id="wf"+i;d.appendChild(fb);
 const a=document.createElement("div");a.id="a"+i;a.className="answer hidden";
 const st=document.createElement("strong");st.textContent="答え：";const at=document.createElement("span");at.textContent=q.en;
 const yo=document.createElement("div");yo.className="yours";
 a.appendChild(st);a.appendChild(at);a.appendChild(yo);d.appendChild(a);
 bar.querySelectorAll(".caseBtn").forEach(b=>{
   b.addEventListener("pointerdown",e=>e.preventDefault());   // 入力欄のカーソルを外さない
   b.onclick=()=>{const m=b.dataset.mode;if(m==="one")oneShot=!oneShot;else{caseMode=m;oneShot=false}refreshCaseBtns();if(!inp.readOnly)inp.focus()};
 });
 const keyState=e=>{if(e.getModifierState)capsKey=e.getModifierState("CapsLock");shiftKey=e.shiftKey};
 inp.addEventListener("keydown",e=>{keyState(e);if(e.key==="Enter"&&!e.isComposing){e.preventDefault();checkW(i)}});
 inp.addEventListener("keyup",keyState);
 inp.addEventListener("input",e=>{if(!e.isComposing)applyCase(inp)});
 inp.addEventListener("compositionend",()=>applyCase(inp));
 ["paste","drop"].forEach(ev=>inp.addEventListener(ev,e=>{e.preventDefault();fbSet(i,"ng","はりつけはできません。自分で打ちこもう。")}));
 ck.onclick=()=>checkW(i);
 gu.onclick=()=>{if(wst[i]!=="try")return;wst[i]="retype";yo.textContent="";a.classList.remove("hidden");inp.value="";inp.dataset.prev="";
   fbSet(i,"ng","答えを見て、正しい英文を打ちこんでから「チェック」を押そう。");gu.disabled=true;inp.focus()};
}
function fbSet(i,cls,msg){const f=document.getElementById("wf"+i);f.className="wfb "+cls;f.textContent=msg}
function checkW(i){
 const q=qs[i],inp=document.getElementById("w"+i),a=document.getElementById("a"+i),val=inp.value;
 if(wst[i]==="ok"||wst[i]==="fixed")return;
 if(!val.trim()){fbSet(i,"ng","英文を打ってから「チェック」を押そう。");inp.focus();return}
 if(/[^\x00-\x7F]/.test(val.replace(/[‘’]/g,""))){fbSet(i,"ng","日本語入力（全角）になっています。半角英数に切りかえて打ち直そう。");inp.focus();return}
 const r=judge(val,q),box=inp.closest(".q");
 if(r==="ok"){
   const first=wst[i]==="try";wst[i]=first?"ok":"fixed";marks[i-2]=first?"same":"fixed";
   fbSet(i,"ok",first?"○ 正解！":"○ 正しく打ち直せました！");
   inp.readOnly=true;box.querySelectorAll(".checkBtn,.giveUp").forEach(b=>b.disabled=true);
   a.querySelector(".yours").textContent="";a.classList.remove("hidden");
   update();return;
 }
 const hint=HINT[r]?" "+HINT[r]:"";
 if(wst[i]==="try"){
   wst[i]="retype";a.querySelector(".yours").textContent="あなたの答え："+val;a.classList.remove("hidden");
   box.querySelector(".giveUp").disabled=true;inp.value="";inp.dataset.prev="";
   fbSet(i,"ng","× ちがいます。"+hint+" 答えを見て、正しい英文を打ち直してから、もう一度「チェック」を押そう。");
 }else fbSet(i,"ng","× まだちがいます。"+hint+" 答えと1語ずつ比べて直そう。");
 inp.focus();
}
function gradeChoices(){let s=0;for(let i=0;i<2;i++){const sel=document.querySelector('input[name="q'+i+'"]:checked'),f=document.getElementById("f"+i);if(!sel){f.textContent="未回答";f.className="ng";continue}const ok=sel.value===qs[i].answer;if(ok)s++;f.textContent=ok?"○ 正解":"× 正解："+qs[i].answer;f.className=ok?"ok":"ng"}choiceScore=s;update()}
function update(){
 const o=document.getElementById("score");
 if(choiceScore===null){
   o.textContent="まず選択問題2問を採点してください。";
   return;
 }
 if(marks.some(x=>x===null)){
   o.innerHTML='<strong>英作文3問を英語で打ちこんで「チェック」を押そう。</strong><br>まちがえた問題は、答えを見て正しい英文を打ち直すとクリアできます。';
   return;
 }
 finished=true;
 const corrected=marks.filter(x=>x==="fixed").length;
 const choiceWrong=2-choiceScore;
 let msg="";
 if(choiceWrong===0 && corrected===0){
   msg='<span class="ok">ぜんぶ確認できました。Level Clear!</span>';
 }else{
   msg='<span class="ok">確認・訂正完了。Level Clear!</span>';
 }
 o.innerHTML=msg+'<div class="muted" style="margin-top:6px">間違いは、直したところまでが学習です。</div>';
 document.getElementById("lockMsg").textContent="このLevelは終了しました。Level選択へ戻れます。";
 document.getElementById("backToLevels").classList.remove("hidden");
 const cls=Number(document.getElementById("classNo").value),no=Number(document.getElementById("studentNo").value);
 saveCleared(current);refreshProgress();
 document.getElementById("passWord").textContent=clearWords(cls,no)[current-1];document.getElementById("passLv").textContent="シートの「Level "+current+"」の欄に書こう";
 document.getElementById("passPanel").classList.remove("hidden");
 document.getElementById("passPanel").scrollIntoView({behavior:"smooth",block:"center"});
}
})();
</script>
