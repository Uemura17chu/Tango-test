const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const qEl = document.getElementById('q');

// group by folder, preserve order
function buildGroups(items){
  const map = new Map();
  for(const it of items){
    if(!map.has(it.folder)) map.set(it.folder, []);
    map.get(it.folder).push(it);
  }
  return map;
}

function render(filter){
  filter = (filter||'').trim().toLowerCase();
  const filtered = filter
    ? ITEMS.filter(it => (it.name+' '+it.folder).toLowerCase().includes(filter))
    : ITEMS;
  const groups = buildGroups(filtered);
  listEl.innerHTML = '';
  let total = 0;
  for(const [folder, files] of groups){
    total += files.length;
    const d = document.createElement('details');
    if(filter) d.open = true;             // auto-open when searching
    const s = document.createElement('summary');
    s.innerHTML = '<span>'+escapeHtml(folder)+'</span><span class="cnt">'+files.length+'</span>';
    d.appendChild(s);
    const wrap = document.createElement('div');
    wrap.className = 'files';
    for(const it of files){
      const a = document.createElement('a');
      a.className = 'file';
      a.href = it.url;
      a.target = '_self';
      a.textContent = it.name.replace(/\.pptx$/i,'');
      wrap.appendChild(a);
    }
    d.appendChild(wrap);
    listEl.appendChild(d);
  }
  countEl.textContent = total + ' 件 / 全 ' + ITEMS.length + ' 件';
  emptyEl.style.display = total ? 'none' : 'block';
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let timer=null;
qEl.addEventListener('input', ()=>{
  clearTimeout(timer);
  timer=setTimeout(()=>render(qEl.value),120);
});
render('');
