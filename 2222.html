<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>棒引き 本数記録</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#111;background:#f4f4f4}
*{box-sizing:border-box} body{margin:0;padding:12px;max-width:1100px;margin:auto}
h1{font-size:30px;margin:4px 0 2px;text-align:center}.sub{text-align:center;font-size:22px;font-weight:800;margin-bottom:10px}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.tab{min-height:58px;border:2px solid #777;border-radius:12px;background:#fff;font-size:18px;font-weight:800}.tab.active{background:#111;color:#fff}
.card{background:#fff;border:3px solid #bbb;border-radius:14px;margin:10px 0;padding:10px}.card.done{border-color:#18864b;background:#f2fff6}.top{display:grid;grid-template-columns:60px 1fr 100px;align-items:center;gap:8px}.hat{font-size:36px;font-weight:900;text-align:center}.match{font-size:25px;font-weight:900}.status{text-align:center;font-size:18px;font-weight:900;color:#18864b}
.side{display:grid;grid-template-columns:90px repeat(4,1fr);gap:7px;align-items:center;margin-top:8px}.label{font-size:22px;font-weight:900;text-align:center}.num{min-height:58px;border:2px solid #777;border-radius:10px;background:#fafafa;font-size:28px;font-weight:900}.num.sel{background:#111;color:#fff;border-color:#111}.num:disabled{opacity:.18}
.progress{position:sticky;bottom:8px;background:#111;color:white;padding:12px;border-radius:12px;text-align:center;font-size:20px;font-weight:900;margin-top:12px;box-shadow:0 3px 12px #999}.controls{display:flex;gap:8px;margin:12px 0}.controls button{flex:1;padding:14px;border-radius:10px;border:1px solid #888;background:#fff;font-size:17px;font-weight:800}
.summary{display:none;background:white;padding:14px;border-radius:14px}.rank{font-size:24px;font-weight:900;padding:8px;border-bottom:1px solid #ddd}.warn{color:#b00020;font-weight:800;text-align:center}
@media(max-width:650px){body{padding:7px}h1{font-size:25px}.sub{font-size:19px}.top{grid-template-columns:48px 1fr 72px}.hat{font-size:31px}.match{font-size:21px}.side{grid-template-columns:64px repeat(4,1fr);gap:5px}.label{font-size:18px}.num{min-height:52px;font-size:25px}.tab{font-size:16px}}
</style>
</head>
<body>
<h1>1年学年競技　棒引き</h1>
<div class="sub">「みんなで棒を引くまで帰れません！」　本数記録</div>
<div id="tabs" class="tabs"></div>
<div id="screen"></div>
<div class="controls"><button onclick="showSummary()">クラス別 合計・順位</button><button onclick="resetCurrent()">この回を消去</button></div>
<div id="summary" class="summary"></div>
<div id="progress" class="progress"></div>
<script>
const sessions=[
 {id:'preF',label:'予行 女子',matches:[['2B','1A'],['3B','2A'],['4B','3A'],['5B','4A'],['6B','5A'],['7B','6A'],['1B','7A']]},
 {id:'preM',label:'予行 男子',matches:[['2B','1A'],['3B','2A'],['4B','3A'],['5B','4A'],['6B','5A'],['7B','6A'],['1B','7A']]},
 {id:'day1F',label:'本番① 女子',matches:[['3B','1A'],['4B','2A'],['5B','3A'],['6B','4A'],['7B','5A'],['1B','6A'],['2B','7A']]},
 {id:'day1M',label:'本番① 男子',matches:[['3B','1A'],['4B','2A'],['5B','3A'],['6B','4A'],['7B','5A'],['1B','6A'],['2B','7A']]},
 {id:'day2F',label:'本番② 女子',matches:[['4B','1A'],['5B','2A'],['6B','3A'],['7B','4A'],['1B','5A'],['2B','6A'],['3B','7A']]},
 {id:'day2M',label:'本番② 男子',matches:[['4B','1A'],['5B','2A'],['6B','3A'],['7B','4A'],['1B','5A'],['2B','6A'],['3B','7A']]}
];
const hats=['あ','い','う','え','お','か','き'];
let current=0;
let data=JSON.parse(localStorage.getItem('bouhikiScoresV1')||'{}');
function save(){localStorage.setItem('bouhikiScoresV1',JSON.stringify(data))}
function key(s,i){return s.id+'_'+i}
function renderTabs(){tabs.innerHTML=sessions.map((s,i)=>`<button class="tab ${i===current?'active':''}" onclick="current=${i};render()">${s.label}</button>`).join('')}
function render(){renderTabs();summary.style.display='none';const s=sessions[current];let html='';s.matches.forEach((m,i)=>{let d=data[key(s,i)]||{B:null,A:null};let done=d.B!==null&&d.A!==null;html+=`<div class="card ${done?'done':''}"><div class="top"><div class="hat">${hats[i]}</div><div class="match">${m[0]} － ${m[1]}</div><div class="status">${done?'✓ 記録済':''}</div></div>${sideHtml(s,i,'B',m[0],d)}${sideHtml(s,i,'A',m[1],d)}</div>`});screen.innerHTML=html;updateProgress()}
function sideHtml(s,i,side,name,d){return `<div class="side"><div class="label">${name}</div>${[0,1,2,3].map(n=>{let other=side==='B'?d.A:d.B;let disabled=other!==null&&n+other>3;return `<button class="num ${d[side]===n?'sel':''}" ${disabled?'disabled':''} onclick="setScore('${s.id}',${i},'${side}',${n})">${n}</button>`}).join('')}</div>`}
function setScore(sid,i,side,n){let s=sessions.find(x=>x.id===sid),k=key(s,i),d=data[k]||{B:null,A:null};d[side]=n;let other=side==='B'?d.A:d.B;if(other!==null&&d.B+d.A>3){if(side==='B')d.A=null;else d.B=null}data[k]=d;save();render()}
function updateProgress(){let s=sessions[current],done=s.matches.filter((_,i)=>{let d=data[key(s,i)];return d&&d.B!==null&&d.A!==null}).length;progress.textContent=done===7?'✓ 7試合すべて記録しました':`${s.label}　記録済み ${done} / 7`}
function resetCurrent(){if(!confirm(sessions[current].label+' の記録をすべて消しますか？'))return;sessions[current].matches.forEach((_,i)=>delete data[key(sessions[current],i)]);save();render()}
function showSummary(){let totals=Array(8).fill(0);sessions.forEach(s=>s.matches.forEach((m,i)=>{let d=data[key(s,i)];if(!d)return;if(d.B!==null)totals[+m[0][0]]+=d.B;if(d.A!==null)totals[+m[1][0]]+=d.A}));let rows=[1,2,3,4,5,6,7].map(c=>({c,t:totals[c]}));rows.sort((a,b)=>b.t-a.t||a.c-b.c);let rank=0,last=null;rows.forEach((r,i)=>{if(r.t!==last)rank=i+1;r.rank=rank;last=r.t});summary.innerHTML='<h2>クラス別　総獲得本数・順位</h2>'+rows.map(r=>`<div class="rank">${r.rank}位　${r.c}組　${r.t}本</div>`).join('')+'<p class="warn">※未入力の試合がある場合、その得点は合計に含まれません。</p>';summary.style.display='block';summary.scrollIntoView({behavior:'smooth'})}
render();
</script>
</body></html>
