<style>
  :root{
    --bg:        #eaf4fb;
    --header:    #3d8bd4;
    --header2:   #5aa9e6;
    --card:      #ffffff;
    --border:    #cfe3f5;
    --text:      #1f3a52;
    --muted:     #6b8299;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"BIZ UDPGothic","Meiryo","Hiragino Kaku Gothic ProN","Segoe UI",system-ui,sans-serif;
    line-height:1.5;
  }

  header{
    background:linear-gradient(135deg,var(--header2),var(--header));
    color:#fff;
    padding:28px 24px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
  }
  header h1{ margin:0; font-size:26px; letter-spacing:.02em; }
  header p{ margin:6px 0 0; font-size:14px; opacity:.92; }

  .wrap{ max-width:1100px; margin:0 auto; padding:22px 24px 60px; }

  .search{
    display:block; width:100%; max-width:360px;
    margin:18px 0 8px;
    padding:11px 14px; font-size:15px;
    border:2px solid var(--border); border-radius:10px;
    background:#fff; color:var(--text);
  }
  .search:focus{ outline:none; border-color:var(--header); }

  .category{ margin-top:30px; }
  .category h2{
    font-size:18px; margin:0 0 12px;
    padding-left:12px; border-left:6px solid var(--cat,#4a90d9);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:14px;
  }
  a.card{
    display:block;
    background:var(--card);
    border:1px solid var(--border);
    border-top:4px solid var(--cat,#4a90d9);
    border-radius:12px;
    padding:16px 16px 13px;
    text-decoration:none; color:var(--text);
    box-shadow:0 1px 3px rgba(30,60,90,.06);
    transition:transform .08s ease, box-shadow .12s ease, border-color .12s ease;
  }
  a.card:hover{
    transform:translateY(-3px);
    box-shadow:0 6px 16px rgba(30,60,90,.16);
    border-color:var(--cat,#4a90d9);
  }
  a.card:focus-visible{ outline:3px solid var(--header); outline-offset:2px; }
  a.card .name{ font-size:16px; font-weight:700; word-break:break-word; }
  a.card .host{ font-size:12px; color:var(--muted); margin-top:6px; word-break:break-all; }

  .empty{ color:var(--muted); font-size:14px; padding:8px 0; }
  footer{ text-align:center; color:var(--muted); font-size:12px; padding:24px; }
</style>
</head>
<body>

<header>
  <h1 id="pageTitle"></h1>
  <p id="pageDesc"></p>
</header>

<div class="wrap">
  <input type="text" id="search" class="search" placeholder="🔍 サイト名でしぼりこむ">
  <div id="list"></div>
</div>

<footer>クリックで新しいタブに開きます</footer>

<script>
  // カテゴリーごとの色（上から順に対応。足りなければ先頭からくり返し）
  const 色 = ["#4a90d9","#43a047","#f57c00","#8e44ad","#00897b","#607d8b"];

  document.getElementById("pageTitle").textContent = ページタイトル;
  document.getElementById("pageDesc").textContent  = ページの説明;
  document.title = ページタイトル;

  // URLが https:// で始まっていなければ補う（書きまちがい対策）
  function 整える(url){
    url = (url || "").trim();
    if(!url) return "";
    if(!/^https?:\/\//i.test(url)) url = "https://" + url;
    return url;
  }
  function ホスト名(url){
    try{ return new URL(url).hostname.replace(/^www\./,""); }
    catch(e){ return ""; }
  }

  const list = document.getElementById("list");

  サイト一覧.forEach((グループ, i) => {
    const color = 色[i % 色.length];

    const section = document.createElement("div");
    section.className = "category";
    section.style.setProperty("--cat", color);

    const h2 = document.createElement("h2");
    h2.textContent = グループ.カテゴリー || "";
    section.appendChild(h2);

    const grid = document.createElement("div");
    grid.className = "grid";

    (グループ.サイト || []).forEach(サイト => {
      const url = 整える(サイト.url);
      const a = document.createElement("a");
      a.className = "card";
      a.href = url || "#";
      a.target = "_blank";
      a.rel = "noopener";
      a.dataset.search = (サイト.名前 || "") + " " + url;

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = サイト.名前 || "(名前なし)";

      const host = document.createElement("div");
      host.className = "host";
      host.textContent = ホスト名(url);

      a.appendChild(name);
      a.appendChild(host);
      grid.appendChild(a);
    });

    section.appendChild(grid);
    list.appendChild(section);
  });

  // しぼりこみ
  const search = document.getElementById("search");
  search.addEventListener("input", () => {
    const q = search.value.trim().toLowerCase();
    document.querySelectorAll(".category").forEach(sec => {
      let shown = 0;
      sec.querySelectorAll("a.card").forEach(card => {
        const hit = card.dataset.search.toLowerCase().includes(q);
        card.style.display = hit ? "" : "none";
        if(hit) shown++;
      });
      sec.style.display = shown ? "" : "none";
    });
  });
</script>

</body>
</html>
