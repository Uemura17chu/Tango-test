<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ロケット発射！ 宇宙へGO</title>
<style>
:root{--bg:#120c2c;--panel:#221a4d;--panel2:#30276f;--text:#fff;--sub:#c3bcef;--gold:#ffd84a;--pink:#ff5fb7;--ok:#4ade80;--ng:#ff6b6b}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg)}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:16px 16px 40px}
.screen{display:none}.screen.active{display:block}
.btn{border:0;border-radius:14px;padding:12px 22px;font-size:17px;font-weight:800;color:#2a1050;background:var(--gold);box-shadow:0 5px 0 #b8901a;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b8901a}
.btn.sub{background:#ffffff1f;color:#fff;box-shadow:0 5px 0 #00000055}
.small{font-size:13px;color:var(--sub)}
.toplink{display:inline-block;color:var(--sub);text-decoration:none;font-size:14px;padding:6px 12px;border-radius:10px;background:#ffffff14}
.toplink:hover{background:#ffffff26}
.gtitle{text-align:center;margin:10px 0 6px;font-size:clamp(30px,6.4vw,58px);font-weight:900;line-height:1.2;
  background:linear-gradient(90deg,#ffd84a,#ff8a5b,#ff5fb7,#9f7bff,#ffd84a);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gflow 7s linear infinite}
@keyframes gflow{to{background-position:300%}}
.ticon{text-align:center;font-size:clamp(44px,8vw,64px);margin-top:4px;line-height:1;animation:tbob 3s ease-in-out infinite}
@keyframes tbob{50%{transform:translateY(-6px)}}
.lead{text-align:center;color:var(--sub);line-height:1.8;margin:6px auto 18px;max-width:640px}
.panel{background:var(--panel);border-radius:20px;padding:18px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.lvbtn{border:0;border-radius:18px;padding:16px 12px;color:#fff;text-align:center;box-shadow:0 6px 0 #00000055;transition:transform .15s;position:relative}
.lvbtn:hover{transform:translateY(-4px)}
.lvbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #00000055}
.lvbtn .k{font-size:12px;opacity:.85}
.lvbtn .n{font-size:22px;font-weight:900;margin:4px 0}
.lvbtn .d{font-size:12px;opacity:.92;line-height:1.5}
.lvbtn .best{margin-top:8px;font-size:12px;background:#00000033;border-radius:999px;padding:2px 10px;display:inline-block}
.lvbtn[disabled]{filter:grayscale(1) brightness(.55);cursor:not-allowed;transform:none}
.g1{background:linear-gradient(150deg,#22c55e,#0ea5a4)}.g2{background:linear-gradient(150deg,#3b82f6,#8b5cf6)}.g3{background:linear-gradient(150deg,#f97316,#e11d48)}.g4{background:linear-gradient(150deg,#a855f7,#ec4899)}.g5{background:linear-gradient(150deg,#eab308,#dc2626)}
.howto{margin-top:14px;font-size:13px;color:var(--sub);line-height:1.9}
.hud{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hud>div{flex:1;min-width:84px;background:var(--panel);border-radius:14px;padding:6px 10px;text-align:center}
.hud small{display:block;color:var(--sub);font-size:12px}
.hud b{font-size:24px}
.low{color:var(--ng)!important}
.tbox{background:#fff;color:#1d1440;border-radius:20px;padding:16px;text-align:center;box-shadow:0 8px 0 #00000040;position:relative}
.t-main{font-size:clamp(24px,4.2vw,38px);font-weight:900;line-height:1.3}
.t-kana{font-size:clamp(15px,2.2vw,20px);margin-top:6px;letter-spacing:.05em}
.t-roma{font-family:Consolas,"Courier New",monospace;font-size:clamp(19px,3vw,28px);margin-top:8px;letter-spacing:.05em;word-break:break-all}
.t-sub{font-size:14px;color:#6b6290;margin-top:6px}
.d{color:#c9c2e6}
.c{background:var(--gold);border-radius:4px;color:#1d1440}
.shake{animation:shk .18s}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.warn{display:none;margin-top:10px;background:var(--ng);border-radius:12px;padding:8px;font-weight:800;text-align:center}
.count{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000000a0;z-index:50;font-size:140px;font-weight:900;color:var(--gold)}
.count span{animation:cpop .9s}
@keyframes cpop{0%{transform:scale(2.4);opacity:0}30%{transform:scale(1);opacity:1}}
.conf{position:fixed;top:-40px;font-size:26px;pointer-events:none;z-index:60;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}
.rcard{background:var(--panel);border-radius:22px;padding:22px;max-width:640px;margin:20px auto;text-align:center}
.rcard h2{font-size:clamp(28px,5vw,42px);margin:4px 0 8px}
.rgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.rgrid div{background:var(--panel2);border-radius:14px;padding:10px 12px}
.rgrid small{color:var(--sub);font-size:12px;display:block}
.rgrid b{font-size:26px}
.hl{background:linear-gradient(90deg,#ff5fb7,#ffb84a);color:#2a1050;border-radius:14px;padding:10px 14px;font-weight:900;margin:10px 0;animation:getin .5s}
.hl.g{background:linear-gradient(90deg,#4ade80,#22d3ee)}
@keyframes getin{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:none;opacity:1}}
.rbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.esc{text-align:center;margin-top:10px}

body{background:radial-gradient(ellipse at 50% -10%,#1d3f8f 0%,transparent 60%),#070a1f;background-attachment:fixed}
.sky{position:relative;height:clamp(320px,54vh,480px);border-radius:20px;overflow:hidden;box-shadow:0 10px 0 #00000055;background:#87ceeb;transition:background 1.2s}
.stars{position:absolute;inset:-50% 0 0;opacity:0;transition:opacity 1.5s;
  background-image:radial-gradient(1.5px 1.5px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 25% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 35%,#fff,transparent),radial-gradient(1px 1px at 55% 85%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 15%,#fff,transparent),radial-gradient(1px 1px at 85% 55%,#fff,transparent),radial-gradient(1px 1px at 95% 90%,#fff,transparent),radial-gradient(1.5px 1.5px at 5% 95%,#fff,transparent);
  background-size:300px 300px;animation:drift 6s linear infinite}
@keyframes drift{to{background-position:0 300px}}
.ground{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(180deg,#5aa848,#3b7d30);transition:transform 1.5s ease-in}
.pad{position:absolute;left:50%;bottom:58px;width:90px;height:14px;margin-left:-45px;background:#6b7280;border-radius:4px;transition:transform 1.5s ease-in}
.rocket{position:absolute;left:50%;bottom:70px;width:70px;margin-left:-35px;transition:bottom 1.2s cubic-bezier(.3,.7,.3,1)}
.rocket svg{width:100%;display:block}
.flame{transform-origin:50% 0;animation:flick .12s infinite alternate}
@keyframes flick{to{transform:scaleY(.8) scaleX(.9)}}
.rocket.boost .flame{animation:none;transform:scaleY(1.7)}
.obj{position:absolute;font-size:46px;pointer-events:none;animation:pass 3.2s linear forwards}
@keyframes pass{from{transform:translateY(-120px)}to{transform:translateY(var(--h))}}
.cl{position:absolute;background:#fff;border-radius:999px;opacity:.9;pointer-events:none;animation:pass 1.6s linear forwards}
.speed{position:absolute;width:2px;background:linear-gradient(#ffffff00,#ffffffaa);pointer-events:none;animation:pass .5s linear forwards}
.alt{position:absolute;left:12px;top:12px;background:#000000a8;border-radius:14px;padding:6px 14px;z-index:4}
.alt small{display:block;font-size:11px;color:var(--sub)}
.alt b{font-size:clamp(20px,3.6vw,30px);color:var(--gold);font-family:Consolas,monospace}
.mile{position:absolute;left:50%;top:16%;transform:translateX(-50%);text-align:center;background:#000000b8;border:2px solid var(--gold);border-radius:16px;padding:10px 18px;z-index:5;opacity:0;pointer-events:none;white-space:nowrap}
.mile.on{animation:mile 2.4s}
.mile b{display:block;font-size:clamp(18px,3.4vw,28px)}
.mile small{color:var(--sub)}
@keyframes mile{0%{opacity:0;transform:translateX(-50%) scale(.5)}12%{opacity:1;transform:translateX(-50%) scale(1.08)}20%{transform:translateX(-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
.next{position:absolute;right:12px;top:12px;background:#000000a8;border-radius:14px;padding:6px 14px;z-index:4;text-align:right;font-size:13px}
.next b{color:var(--gold)}
.tbox{margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
<section id="title" class="screen active">
  <a class="toplink" href="typing_index.html">◀ トップへ</a>
  <div class="ticon">🚀</div><div class="gtitle">ロケット発射！<br>宇宙へGO</div>
  <p class="lead">打てば打つほどロケットが上昇！ 雲をぬけ、宇宙ステーション、月、そして土星へ……<br>60秒で、どこまで遠くへ行けるかな？</p>
  <div class="levels"><button class="lvbtn g2" onclick="start()"><div class="k">Enter</div><div class="n">発射！</div><div class="d">宇宙のことばを日本語で打とう<br>宇宙・ロケット・流れ星 …</div><div class="best" id="best"></div></button></div>
  <div class="howto">🔤 入力は「半角英数」のローマ字で。しゅ→ shu / syu など、どちらの打ち方でもOK。<br>🔥 1文字ごとに上昇。ことばを打ち切るとブースト！</div>
</section>

<section id="play" class="screen">
  <div class="hud">
    <div><small>のこり時間</small><b id="time">60</b></div>
    <div><small>打った数</small><b id="keys">0</b></div>

    <div class="stars" id="stars"></div>

      <g class="flame" style="transform-box:fill-box"><path d="M24 118 Q35 168 46 118 Z" fill="#ffb020"/><path d="M29 118 Q35 150 41 118 Z" fill="#fff3a0"/></g>
      <path d="M35 4 Q60 34 56 104 L14 104 Q10 34 35 4 Z" fill="#f4f6fb"/><path d="M35 4 Q48 18 52 34 L18 34 Q22 18 35 4 Z" fill="#e53935"/>
      <circle cx="35" cy="56" r="11" fill="#7cc7ff" stroke="#9aa5b1" stroke-width="4"/>
      <path d="M14 76 L0 112 L14 104 Z M56 76 L70 112 L56 104 Z" fill="#e53935"/><rect x="20" y="104" width="30" height="14" rx="3" fill="#6b7280"/>
      <text x="35" y="92" font-size="9" text-anchor="middle" font-weight="900" fill="#1d1440" font-family="sans-serif">JAPAN</text></svg></div>
    <div class="alt"><small>きょり</small><b id="alt">0 m</b></div>

  </div>

    <div class="t-main" id="qText"></div>

</section>

<section id="result" class="screen"><div class="rcard" id="res"></div></section>
</div>

<script>
/* ===== 共通部品 ===== */
const $=s=>document.querySelector(s);
let CUR='title';
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$('#'+id).classList.add('active');CUR=id;scrollTo(0,0)}
function sget(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function sset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let AC=null;
function beep(f,d,type,v,slide){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v||.03,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function okSound(){beep(1000,.025,'square',.018)}
function ngSound(){beep(140,.12,'sawtooth',.04)}
function jingle(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,.22,'triangle',.06),i*90))}
function sadSound(){[392,330,262].forEach((f,i)=>setTimeout(()=>beep(f,.3,'triangle',.05),i*180))}
function countdown(cb){const cd=$('#count');cd.style.display='flex';let n=3;
  const step=()=>{if(n>0){cd.innerHTML=`<span>${n}</span>`;beep(440,.15,'triangle',.05);n--;setTimeout(step,750)}
    else{cd.innerHTML='<span>GO!</span>';beep(880,.3,'triangle',.06);setTimeout(()=>{cd.style.display='none';cb()},450)}};step()}
function confetti(n){const em=['🎉','✨','⭐','🎊','💖'];for(let i=0;i<(n||40);i++){const s=document.createElement('div');s.className='conf';s.textContent=em[i%5];
  s.style.left=Math.random()*100+'vw';s.style.animationDuration=(1.6+Math.random()*2)+'s';s.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),4500)}}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function warn(m){const w=$('#warn');if(!w)return;if(m){w.textContent='⚠ '+m;w.style.display='block'}else w.style.display='none'}
/* キー入力を1文字に。日本語入力ON・CapsLockは警告 */
function readKey(e){
  if(e.isComposing||e.key==='Process'||e.keyCode===229){return null}
  if(e.ctrlKey||e.metaKey||e.altKey||e.key.length!==1)return null;
  e.preventDefault();
  if(e.repeat)return null;
  if(e.getModifierState&&e.getModifierState('CapsLock'))warn('CapsLock がONです。Shift＋CapsLock で解除してね');else warn('');
  return e.key;
}
/* ===== ローマ字判定（いろいろな打ち方に対応） ===== */
const RT={
 'あ':['a'],'い':['i','yi'],'う':['u','wu','whu'],'え':['e'],'お':['o'],
 'か':['ka','ca'],'き':['ki'],'く':['ku','cu','qu'],'け':['ke'],'こ':['ko','co'],
 'さ':['sa'],'し':['si','shi','ci'],'す':['su'],'せ':['se','ce'],'そ':['so'],
 'た':['ta'],'ち':['ti','chi'],'つ':['tu','tsu'],'て':['te'],'と':['to'],
 'な':['na'],'に':['ni'],'ぬ':['nu'],'ね':['ne'],'の':['no'],
 'は':['ha'],'ひ':['hi'],'ふ':['hu','fu'],'へ':['he'],'ほ':['ho'],
 'ま':['ma'],'み':['mi'],'む':['mu'],'め':['me'],'も':['mo'],
 'や':['ya'],'ゆ':['yu'],'よ':['yo'],
 'ら':['ra'],'り':['ri'],'る':['ru'],'れ':['re'],'ろ':['ro'],
 'わ':['wa'],'を':['wo'],
 'が':['ga'],'ぎ':['gi'],'ぐ':['gu'],'げ':['ge'],'ご':['go'],
 'ざ':['za'],'じ':['zi','ji'],'ず':['zu'],'ぜ':['ze'],'ぞ':['zo'],
 'だ':['da'],'ぢ':['di'],'づ':['du'],'で':['de'],'ど':['do'],
 'ば':['ba'],'び':['bi'],'ぶ':['bu'],'べ':['be'],'ぼ':['bo'],
 'ぱ':['pa'],'ぴ':['pi'],'ぷ':['pu'],'ぺ':['pe'],'ぽ':['po'],'ゔ':['vu'],
 'ぁ':['xa','la'],'ぃ':['xi','li'],'ぅ':['xu','lu'],'ぇ':['xe','le'],'ぉ':['xo','lo'],
 'ゃ':['xya','lya'],'ゅ':['xyu','lyu'],'ょ':['xyo','lyo'],'ゎ':['xwa','lwa'],
 'っ':['xtu','ltu','xtsu','ltsu'],
 'ー':['-'],'、':[','],'。':['.'],'！':['!'],'？':['?'],'　':[' '],' ':[' ']
};
const RY={};
[['き','ky'],['に','ny'],['ひ','hy'],['み','my'],['り','ry'],['ぎ','gy'],['び','by'],['ぴ','py']].forEach(([k,r])=>{RY[k+'ゃ']=[r+'a'];RY[k+'ゅ']=[r+'u'];RY[k+'ょ']=[r+'o'];RY[k+'ぇ']=[r+'e']});
Object.assign(RY,{
 'しゃ':['sya','sha'],'しゅ':['syu','shu'],'しょ':['syo','sho'],'しぇ':['sye','she'],
 'ちゃ':['tya','cha','cya'],'ちゅ':['tyu','chu','cyu'],'ちょ':['tyo','cho','cyo'],'ちぇ':['tye','che','cye'],
 'じゃ':['zya','ja','jya'],'じゅ':['zyu','ju','jyu'],'じょ':['zyo','jo','jyo'],'じぇ':['zye','je','jye'],
 'ぢゃ':['dya'],'ぢゅ':['dyu'],'ぢょ':['dyo'],
 'ふぁ':['fa'],'ふぃ':['fi'],'ふぇ':['fe'],'ふぉ':['fo'],
 'てぃ':['thi'],'でぃ':['dhi'],'うぃ':['wi'],'うぇ':['we'],'ゔぁ':['va'],'ゔぃ':['vi'],'ゔぇ':['ve'],'ゔぉ':['vo']
});
function toHira(s){return s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))}
function rcands(K,p){
  if(p>=K.length)return [];
  const out=[],c=K[p];
  if(c==='ん'){
    const nx=K[p+1];
    if(nx!==undefined&&!'あいうえおなにぬねのやゆよんゃゅょ'.includes(nx))out.push({r:'n',len:1});
    out.push({r:'nn',len:1},{r:"n'",len:1},{r:'xn',len:1});return out;
  }
  if(c==='っ'){
    const seen=new Set();
    rcands(K,p+1).forEach(n=>{const f=n.r[0];
      if(f&&/[bcdfghjklmpqrstvwxyz]/.test(f)){const r=f+n.r;if(!seen.has(r)){seen.add(r);out.push({r,len:1+n.len})}}
      if(n.r.startsWith('ch')&&!seen.has('t'+n.r)){seen.add('t'+n.r);out.push({r:'t'+n.r,len:1+n.len})}});
    RT['っ'].forEach(r=>out.push({r,len:1}));return out;
  }
  const two=K.substr(p,2);
  if(RY[two])RY[two].forEach(r=>out.push({r,len:2}));
  (RT[c]||[c]).forEach(r=>out.push({r,len:1}));
  return out;
}
function rguide(K,p){let s='';while(p<K.length){const c=rcands(K,p)[0];s+=c.r;p+=c.len}return s}
/* 日本語1問 */
class JT{
  constructor(text,reading){this.text=text;this.K=toHira(reading);this.p=0;this.b='';this.typed=''}
  press(ch){ch=ch.toLowerCase();
    const cs=rcands(this.K,this.p),b2=this.b+ch,m=cs.filter(c=>c.r.startsWith(b2));
    if(!m.length){const ex=this.b&&cs.find(c=>c.r===this.b);
      if(ex){this.p+=ex.len;this.b='';if(this.p>=this.K.length)return false;return this.press(ch)}return false}
    this.b=b2;this.typed+=ch;
    const exact=m.find(c=>c.r===b2);
    if(exact&&!m.some(c=>c.r.length>b2.length)){this.p+=exact.len;this.b=''}
    return true}
  get done(){return this.p>=this.K.length}
  rest(){if(this.b){const c=rcands(this.K,this.p).find(c=>c.r.startsWith(this.b));return c.r.slice(this.b.length)+rguide(this.K,this.p+c.len)}return rguide(this.K,this.p)}
  next(){return this.rest()[0]}
  get keysLeft(){return this.rest().length}
  kanaHTML(){return `<span class="d">${esc(this.K.slice(0,this.p))}</span>${esc(this.K.slice(this.p))}`}
  romaHTML(){const r=this.rest();return `<span class="d">${esc(this.typed)}</span>${r?`<span class="c">${esc(r[0])}</span>${esc(r.slice(1))}`:''}`}
}
/* 英語1問（大文字・小文字も区別） */
class ET{
  constructor(s,sub){this.text=s;this.sub=sub||'';this.i=0}
  press(ch){if(ch===this.text[this.i]){this.i++;return true}return false}
  get done(){return this.i>=this.text.length}
  next(){return this.text[this.i]}
  get keysLeft(){return this.text.length-this.i}
  html(){const t=this.text,i=this.i;const cur=t[i]===' '?'␣':esc(t[i]||'');
    return `<span class="d">${esc(t.slice(0,i))}</span>${i<t.length?`<span class="c">${cur}</span>${esc(t.slice(i+1))}`:''}`}
}
window.__next=()=>window.CURT&&!window.CURT.done?window.CURT.next():null;

const TIME=60,KEY='rocket_v1';
/* [表示, よみ] */
const WORDS=[
 ['宇宙','うちゅう'],['ロケット','ろけっと'],['月','つき'],['星','ほし'],['太陽','たいよう'],['地球','ちきゅう'],['銀河','ぎんが'],
 ['流れ星','ながれぼし'],['星座','せいざ'],['発射','はっしゃ'],['重力','じゅうりょく'],['宇宙飛行士','うちゅうひこうし'],['人工衛星','じんこうえいせい'],
 ['天の川','あまのがわ'],['望遠鏡','ぼうえんきょう'],['北極星','ほっきょくせい'],['流星群','りゅうせいぐん'],['月面着陸','げつめんちゃくりく'],
 ['無重力','むじゅうりょく'],['酸素','さんそ'],['燃料','ねんりょう'],['カウントダウン','かうんとだうん'],['宇宙ステーション','うちゅうすてーしょん'],
 ['火星','かせい'],['木星','もくせい'],['土星','どせい'],['金星','きんせい'],['水星','すいせい'],['惑星','わくせい'],['ブラックホール','ぶらっくほーる'],
 ['三日月','みかづき'],['満月','まんげつ'],['宇宙人','うちゅうじん'],['UFO','ゆーふぉー'],['探査機','たんさき'],['大気圏','たいきけん']
];
/* 到達ポイント [必要な打数, 名前, きょり(km), アイコン, 説明] */
const MILES=[
 [0,'発射台',0,'🚀',''],
 [12,'雲の上',2,'☁️','高度 約2km'],
 [28,'旅客機と同じ高さ',10,'✈️','高度 約10km'],
 [50,'宇宙の入り口',100,'🌌','高度100km（カーマン・ライン）'],
 [75,'国際宇宙ステーション',400,'🛰️','高度 約400km'],
 [105,'静止衛星の高さ',36000,'📡','高度 約3万6000km'],
 [140,'月',384000,'🌕','地球から 約38万km'],
 [180,'火星',56000000,'🔴','地球に近いときで 約5600万km'],
 [225,'木星',590000000,'🟠','地球に近いときで 約5億9000万km'],
 [280,'土星',1200000000,'🪐','地球に近いときで 約12億km']
];
const SKY=['#87ceeb','#5fa8e8','#3a78cf','#173a7a','#0a1640','#070b26','#05071a','#05051a','#06041a','#070418'];
let best=sget(KEY,{keys:0,mile:0});
function kmAt(k){
  for(let i=0;i<MILES.length-1;i++){const [a,,ka]=MILES[i],[b,,kb]=MILES[i+1];
    if(k<b){const t=(k-a)/(b-a);return i===0?kb*t:ka*Math.pow(kb/ka,t)}}
  const [a,,ka]=MILES[MILES.length-1];return ka*Math.pow(1.03,k-a);
}
function fmt(km){
  if(km<1)return Math.round(km*1000)+' m';
  if(km<10000)return (km<10?km.toFixed(1):Math.round(km).toLocaleString())+' km';
  if(km<1e8)return (km/1e4).toFixed(km<1e5?1:0)+'万 km';
  return (km/1e8).toFixed(1)+'億 km';
}
function goTitle(){$('#best').textContent=best.keys?`ベスト：${MILES[best.mile][1]}まで（${best.keys}打）`:'まだ記録なし';show('title')}
let G=null,timer=null;
function start(){
  G={keys:0,miss:0,power:0,mile:0,running:false,last:-1};
  $('#sky').style.background=SKY[0];$('#stars').style.opacity=0;
  $('#ground').style.transform='';$('#pad').style.transform='';$('#rocket').style.bottom='70px';
  document.querySelectorAll('.obj,.cl,.speed').forEach(e=>e.remove());
  hud();nextQ();warn('');$('#time').textContent=TIME;$('#time').classList.remove('low');
  show('play');
  countdown(()=>{G.running=true;G.t0=performance.now();timer=setInterval(tick,100)});
}
function nextQ(){let i;do{i=Math.floor(Math.random()*WORDS.length)}while(i===G.last);G.last=i;G.t=new JT(...WORDS[i]);window.CURT=G.t;render()}
function render(){$('#qText').textContent=G.t.text;$('#qKana').innerHTML=G.t.kanaHTML();$('#qRoma').innerHTML=G.t.romaHTML()}
function hud(){
  const tot=G.keys+G.miss;$('#keys').textContent=G.keys;$('#miss').textContent=G.miss;$('#acc').textContent=tot?Math.floor(G.keys/tot*100):100;
  $('#alt').textContent=fmt(kmAt(G.power));
  const nx=MILES[G.mile+1];$('#next').innerHTML=nx?`次：${nx[3]} <b>${nx[1]}</b><br>あと ${Math.max(0,nx[0]-G.power)} 打`:'🌟 太陽系の外へ！';
}
function addPower(n){
  G.power+=n;
  if(G.power>12){$('#ground').style.transform='translateY(200px)';$('#pad').style.transform='translateY(200px)';$('#rocket').style.bottom='38%'}
  while(G.mile+1<MILES.length&&G.power>=MILES[G.mile+1][0]){G.mile++;reach(G.mile)}
  const h=$('#sky').clientHeight;
  for(let i=0;i<n;i++){const s=document.createElement('div');s.className='speed';s.style.left=(Math.random()*100)+'%';s.style.top='0';s.style.height=(30+Math.random()*50)+'px';s.style.setProperty('--h',h+80+'px');$('#sky').appendChild(s);setTimeout(()=>s.remove(),520)}
  if(G.mile<=2&&Math.random()<.25){const c=document.createElement('div');c.className='cl';const w=60+Math.random()*120;c.style.width=w+'px';c.style.height=w*.35+'px';c.style.left=(Math.random()*90)+'%';c.style.top='0';c.style.setProperty('--h',h+80+'px');$('#sky').appendChild(c);setTimeout(()=>c.remove(),1650)}
}
function reach(i){
  const m=MILES[i],sky=$('#sky');
  sky.style.background=SKY[Math.min(i,SKY.length-1)];$('#stars').style.opacity=i>=3?1:0;
  const o=document.createElement('div');o.className='obj';o.textContent=m[3];o.style.left=(i%2?18:72)+'%';o.style.top='0';o.style.fontSize=(i>=6?80:50)+'px';o.style.setProperty('--h',sky.clientHeight+140+'px');sky.appendChild(o);setTimeout(()=>o.remove(),3300);
  const ml=$('#mile');ml.innerHTML=`<b>${m[3]} ${m[1]}に到達！</b><small>${m[4]}</small>`;ml.classList.remove('on');void ml.offsetWidth;ml.classList.add('on');
  jingle();
}
function onKey(e){
  if(e.key==='Escape'){quit();return}
  if(!G||!G.running)return;
  const ch=readKey(e);if(ch==null)return;
  if(G.t.press(ch)){
    G.keys++;okSound();
    const r=$('#rocket');r.classList.add('boost');clearTimeout(G.bt);G.bt=setTimeout(()=>r.classList.remove('boost'),120);
    if(G.t.done){addPower(3);beep(1320,.08,'triangle',.05);nextQ()}else{addPower(1);render()}
  }else{G.miss++;ngSound();shake($('#tb'))}
  hud();
}
function tick(){const left=TIME-(performance.now()-G.t0)/1000;$('#time').textContent=Math.max(0,Math.ceil(left));$('#time').classList.toggle('low',left<=10);if(left<=0)end()}
function quit(){clearInterval(timer);if(G)G.running=false;window.CURT=null;$('#count').style.display='none';goTitle()}
function end(){
  clearInterval(timer);G.running=false;window.CURT=null;
  const tot=G.keys+G.miss,acc=tot?Math.floor(G.keys/tot*100):0,m=MILES[G.mile];
  const nb=G.power>best.keys;if(nb){best={keys:G.power,mile:G.mile};sset(KEY,best)}
  let h=`<div style="font-size:64px">${m[3]}</div><h2>${m[1]}まで到達！</h2><p>きょり <b style="color:var(--gold)">${fmt(kmAt(G.power))}</b></p>`;
  if(nb)h+=`<div class="hl g">🔥 自己ベスト更新！</div>`;
  const nx=MILES[G.mile+1];if(nx)h+=`<p>あと <b style="color:var(--gold)">${nx[0]-G.power}</b> 打で「${nx[3]} ${nx[1]}」だった！</p>`;
  h+=`<div class="rgrid"><div><small>打った数</small><b>${G.keys}</b></div><div><small>正確さ</small><b>${acc}%</b></div></div>`;
  h+=`<div class="rbtns"><button class="btn" onclick="start()">もう一度（Enter）</button><button class="btn sub" onclick="goTitle()">もどる（Esc）</button></div>`;
  $('#res').innerHTML=h;show('result');if(nb||G.mile>=6){confetti()}
}
document.addEventListener('keydown',e=>{
  if(CUR==='play'){onKey(e);return}
  if(CUR==='title'&&e.key==='Enter')start();
  if(CUR==='result'){if(e.key==='Enter')start();if(e.key==='Escape')goTitle()}
});
goTitle();
</script>
<a href="typing_index.html" style="position:fixed;left:12px;bottom:12px;z-index:9999;display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;background:rgba(20,14,50,.85);color:#fff;text-decoration:none;font:800 15px/1 'M PLUS Rounded 1c','Hiragino Kaku Gothic ProN','Meiryo',sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.35)">◀ トップへ</a>
<script>
/* ===== iPad・タッチ対応（全ゲーム共通） ===== */
(function(){
  /* 1) 見えない入力欄：iPadでスペースなどのキーを確実に受け取るため */
  const t=document.createElement('input');
  t.type='text';t.id='kbtrap';t.setAttribute('autocomplete','off');t.setAttribute('autocorrect','off');t.setAttribute('autocapitalize','off');t.setAttribute('spellcheck','false');t.setAttribute('aria-hidden','true');t.tabIndex=-1;
  t.style.cssText='position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:0;border:0;padding:0;margin:0;font-size:16px;color:transparent;background:transparent;caret-color:transparent;z-index:-1';
  document.body.appendChild(t);
  const fx=()=>{if(document.activeElement!==t){try{t.focus({preventScroll:true})}catch(e){try{t.focus()}catch(_){}}}};
  document.addEventListener('click',e=>{if(e.target.closest('a,select,textarea,input:not(#kbtrap)'))return;fx()},true);
  window.addEventListener('load',fx);
  let lastKey=0;
  document.addEventListener('keydown',e=>{if(e.isTrusted&&e.key&&e.key.length===1)lastKey=performance.now()},true);
  /* ソフトキーボード等で文字が入力欄に入った場合は、1文字ずつゲームへ送る */
  t.addEventListener('input',()=>{
    const v=t.value;t.value='';if(!v)return;
    if(/[^\x20-\x7e]/.test(v)){toast('日本語入力がONです。英数入力にしてね（iPad：地球儀キー／Windows：半角/全角キー）');return}
    if(performance.now()-lastKey<80)return;
    for(const ch of v)document.dispatchEvent(new KeyboardEvent('keydown',{key:ch,bubbles:true,cancelable:true}));
  });
  t.addEventListener('compositionend',()=>{t.value='';toast('日本語入力がONです。英数入力にしてね（iPad：地球儀キー／Windows：半角/全角キー）')});
  function toast(m){let d=document.getElementById('tapToast');if(!d){d=document.createElement('div');d.id='tapToast';d.style.cssText='position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:10001;background:#ff6b6b;color:#fff;font:800 15px/1.4 sans-serif;padding:10px 16px;border-radius:12px;box-shadow:0 6px 18px #0006;max-width:92vw;text-align:center';document.body.appendChild(d)}
    d.textContent='⚠ '+m;d.style.display='block';clearTimeout(d._t);d._t=setTimeout(()=>d.style.display='none',3500)}
  /* 2) Esc・Enter のかわりになるタップボタン（プレイ中に右上へ表示） */
  const bar=document.createElement('div');
  bar.style.cssText='position:fixed;right:12px;bottom:12px;z-index:10000;display:none;gap:8px';
  const mk=(label,key,bg)=>{const b=document.createElement('button');b.type='button';b.textContent=label;
    b.style.cssText=`border:2px solid #ffffff66;border-radius:999px;padding:12px 18px;font:900 16px/1 'M PLUS Rounded 1c','Hiragino Kaku Gothic ProN','Meiryo',sans-serif;color:#fff;background:${bg};box-shadow:0 4px 14px #0006;cursor:pointer;touch-action:manipulation`;
    b.addEventListener('click',ev=>{ev.preventDefault();document.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}));fx()});bar.appendChild(b);return b};
  const hb=mk('💡 ヒント','Enter','#2563eb');
  mk('✕ やめる','Escape','#dc2626');
  document.body.appendChild(bar);
  function hintLabel(){if(typeof window.pass==='function')return '⏭ パス';try{if(typeof MODE!=='undefined'&&MODE==='ja')return '💡 ヒント'}catch(e){}return ''}
  setInterval(()=>{const p=document.querySelector('#play.active,#battle.active');bar.style.display=p?'flex':'none';const l=hintLabel();hb.style.display=l?'':'none';if(l)hb.textContent=l},250);
})();
</script>
