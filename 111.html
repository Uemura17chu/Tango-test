<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本日の授業</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#eaf3fc;color:#0d2b5e;}
  header{background:#0d47a1;color:#fff;padding:10px 16px;position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.2);}
  .hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .title{font-size:1.25rem;font-weight:bold;flex:1;min-width:140px;}
  .tabs{display:flex;gap:6px;}
  .tab{background:#1b5bbf;color:#cfe0f5;border:none;border-radius:9px;padding:8px 14px;font-size:1rem;font-weight:bold;}
  .tab.active{background:#fff;color:#0d47a1;}
  .editbtn{background:#ffb300;color:#3a2c00;border:none;border-radius:9px;padding:8px 14px;font-size:1rem;font-weight:bold;}
  .editbtn.on{background:#e53935;color:#fff;}
  main{padding:18px 18px 120px;max-width:1000px;margin:0 auto;}
  .menu-btn{display:flex;align-items:center;gap:16px;width:100%;min-height:78px;background:#fff;border:2px solid #90caf9;border-radius:16px;color:#0d47a1;font-size:1.5rem;font-weight:bold;text-decoration:none;padding:14px 22px;margin:0 0 14px;box-shadow:0 2px 6px rgba(0,0,0,.1);}
  .menu-btn:active{background:#bbdefb;}
  .menu-btn .num{display:flex;align-items:center;justify-content:center;min-width:46px;height:46px;background:#0d47a1;color:#fff;border-radius:50%;font-size:1.3rem;flex:none;}
  .empty{color:#5a7ab5;text-align:center;padding:40px 20px;font-size:1.1rem;line-height:1.7;}
  .accessbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:12px;padding:12px 16px;background:rgba(234,243,252,.96);border-top:1px solid #c4d8f0;backdrop-filter:blur(4px);}
  .accessbar button{flex:1;min-height:60px;border:none;border-radius:14px;font-size:1.2rem;font-weight:bold;color:#fff;}
  .accessbar .t{background:#00897b;} .accessbar .p{background:#8e24aa;}
  .overlay{position:fixed;inset:0;z-index:40;background:rgba(0,20,50,.55);display:none;align-items:flex-end;}
  .overlay.show{display:flex;}
  .sheet{background:#fff;width:100%;max-height:82vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;}
  .sheet h3{margin:0;padding:16px 20px;font-size:1.2rem;color:#0d47a1;border-bottom:1px solid #e0e8f4;display:flex;justify-content:space-between;align-items:center;}
  .sheet .close{background:#eceff1;border:none;border-radius:10px;padding:8px 16px;font-size:1rem;font-weight:bold;color:#37474f;}
  .sheet .grid{overflow:auto;padding:14px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .sheet .grid a{display:flex;align-items:center;justify-content:center;text-align:center;min-height:60px;padding:10px;background:#f5f9ff;border:1.5px solid #b8d4f5;border-radius:12px;color:#0d47a1;text-decoration:none;font-weight:600;font-size:.95rem;word-break:break-word;line-height:1.3;}
  .sheet .grid a:active{background:#d6e8ff;}
  .edit-wrap{max-width:1000px;margin:0 auto;padding:16px 18px 130px;}
  .edit-sec{background:#fff;border:1px solid #cfe0f5;border-radius:14px;padding:14px 16px;margin:0 0 16px;}
  .edit-sec h2{font-size:1.05rem;color:#0d47a1;margin:0 0 12px;border-left:6px solid #90caf9;padding-left:10px;}
  .m-item{display:flex;align-items:center;gap:8px;margin:0 0 10px;}
  .m-item .ord{display:flex;flex-direction:column;gap:2px;}
  .m-item .ord button{width:36px;height:26px;border:none;border-radius:6px;background:#e3f2fd;color:#0d47a1;font-weight:bold;font-size:.9rem;}
  .m-item .catbadge{font-size:.7rem;color:#fff;background:#7986cb;border-radius:6px;padding:3px 6px;flex:none;}
  .m-item input{flex:1;font-size:1.05rem;padding:10px 12px;border:1.5px solid #b8d4f5;border-radius:10px;min-width:80px;}
  .m-item .del{background:#e53935;color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:bold;}
  #filter{width:100%;font-size:1.05rem;padding:11px 14px;border:1.5px solid #b8d4f5;border-radius:10px;margin:0 0 12px;}
  details.cat{border:1px solid #dce8f7;border-radius:12px;margin:0 0 10px;overflow:hidden;}
  details.cat>summary{cursor:pointer;list-style:none;padding:11px 14px;font-weight:bold;color:#0d47a1;background:#f3f8ff;display:flex;justify-content:space-between;align-items:center;}
  details.cat>summary::-webkit-details-marker{display:none;}
  details.cat>summary .c{font-size:.8rem;color:#5a7ab5;font-weight:normal;}
  .add-list{padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;}
  .add-list .row{display:flex;align-items:center;gap:8px;background:#f5f9ff;border:1.5px solid #d3e4f8;border-radius:10px;padding:8px 10px;}
  .add-list .row span{flex:1;font-size:.9rem;font-weight:600;color:#33507a;word-break:break-word;}
  .add-list .row button{background:#0d47a1;color:#fff;border:none;border-radius:9px;padding:8px 12px;font-weight:bold;flex:none;}
  .add-list .row button:disabled{background:#b0bec5;}
  .cap{font-size:.85rem;color:#5a7ab5;margin:0 0 12px;}
  .hidden{display:none;}
</style>
</head>

<header>
  <div class="hrow">
    <div class="title" id="title">本日の授業</div>
    <div class="tabs" id="tabs"></div>
    <button class="editbtn" id="editToggle">編集</button>
  </div>
</header>

<main id="studentView"><div id="menuArea"></div></main>

<div class="edit-wrap hidden" id="editView">
  <div class="edit-sec">
    <h2>本日のメニュー（最大8・上から順に実施）</h2>
    <div class="cap" id="menuCap"></div>
    <div id="menuEdit"></div>
  </div>
  <div class="edit-sec">
    <h2>教材から追加</h2>
    <input id="filter" type="search" placeholder="絞り込み（例：Prog4／Scenes／Listen）" autocomplete="off">
    <div id="addArea"></div>
  </div>
</div>

<div class="accessbar" id="accessbar">
  <button class="t" onclick="openSheet('timer')">タイマー</button>
  <button class="p" onclick="openSheet('pv')">PV（曲）</button>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet">
    <h3><span id="sheetTitle"></span><button class="close" onclick="closeSheet()">閉じる</button></h3>
    <div class="grid" id="sheetGrid"></div>
  </div>
</div>

%95%99%E6%9D%90%E3%82%B3%E3%83%B3%E3%83%86%E3%83%B3%E3%83%84/Songs/PV/Zombie.pptx"}]};
const CLASSES = ["1組","2組","4組","7組"];
const MAX = 8;

function loadLabels(){try{return JSON.parse(localStorage.getItem("labels")||"{}");}catch(e){return{};}}
function saveLabels(o){localStorage.setItem("labels",JSON.stringify(o));}
function loadMenu(c){try{return JSON.parse(localStorage.getItem("menu__"+c)||"[]");}catch(e){return[];}}
function saveMenu(c,a){localStorage.setItem("menu__"+c,JSON.stringify(a));}

let labels=loadLabels();
let curClass=localStorage.getItem("curClass")||"1組";
if(!CLASSES.includes(curClass))curClass="1組";
let editMode=false, filterText="";

// lookup by file key
const byFile={};
DATA.categories.forEach(c=>DATA.items[c].forEach(it=>{it._cat=c;byFile[it.file]=it;}));
DATA.timer.forEach(it=>{it._cat="timer";byFile[it.file]=it;});
DATA.pv.forEach(it=>{it._cat="pv";byFile[it.file]=it;});
function labelOf(f){return (labels[f]&&labels[f].trim())?labels[f]:(byFile[f]?byFile[f].name:f);}
function urlOf(f){return byFile[f]?byFile[f].url:"#";}
function catOf(f){return byFile[f]?byFile[f]._cat:"";}

function renderTabs(){
  const t=document.getElementById("tabs");t.innerHTML="";
  CLASSES.forEach(c=>{const b=document.createElement("button");b.className="tab"+(c===curClass?" active":"");b.textContent=c;b.onclick=()=>{curClass=c;localStorage.setItem("curClass",c);renderAll();};t.appendChild(b);});
  document.getElementById("title").textContent=curClass+" 本日の授業";
}

function renderStudent(){
  const area=document.getElementById("menuArea");area.innerHTML="";
  const menu=loadMenu(curClass);
  if(!menu.length){area.innerHTML='<div class="empty">本日のメニューは未設定です。<br>右上の「編集」から教材を追加してください。</div>';return;}
  menu.forEach((f,i)=>{const a=document.createElement("a");a.className="menu-btn";a.href=urlOf(f);a.target="_self";a.innerHTML='<span class="num">'+(i+1)+'</span><span>'+esc(labelOf(f))+'</span>';area.appendChild(a);});
}

function renderEdit(){
  const menu=loadMenu(curClass);
  document.getElementById("menuCap").textContent=menu.length+" / "+MAX+" 選択中";
  const me=document.getElementById("menuEdit");me.innerHTML="";
  menu.forEach((f,i)=>{
    const row=document.createElement("div");row.className="m-item";
    const ord=document.createElement("div");ord.className="ord";
    const up=document.createElement("button");up.textContent="↑";up.onclick=()=>{if(i>0){sw(menu,i,i-1);saveMenu(curClass,menu);renderEdit();}};
    const dn=document.createElement("button");dn.textContent="↓";dn.onclick=()=>{if(i<menu.length-1){sw(menu,i,i+1);saveMenu(curClass,menu);renderEdit();}};
    ord.appendChild(up);ord.appendChild(dn);
    const badge=document.createElement("span");badge.className="catbadge";badge.textContent=catOf(f);
    const inp=document.createElement("input");inp.type="text";inp.value=labelOf(f);inp.oninput=()=>{labels[f]=inp.value;saveLabels(labels);};
    const del=document.createElement("button");del.className="del";del.textContent="削除";del.onclick=()=>{const x=menu.indexOf(f);if(x>=0){menu.splice(x,1);saveMenu(curClass,menu);renderEdit();}};
    row.appendChild(ord);row.appendChild(badge);row.appendChild(inp);row.appendChild(del);me.appendChild(row);
  });
  // add area grouped by category
  const wrap=document.getElementById("addArea");wrap.innerHTML="";
  const ft=filterText.trim().toLowerCase();
  DATA.categories.forEach(cat=>{
    const list=DATA.items[cat].filter(it=>!ft||(it.name+" "+cat).toLowerCase().includes(ft));
    if(!list.length)return;
    const d=document.createElement("details");d.className="cat";if(ft||cat==="Grammar")d.open=true;
    const s=document.createElement("summary");s.innerHTML='<span>'+cat+'</span><span class="c">'+list.length+'</span>';d.appendChild(s);
    const g=document.createElement("div");g.className="add-list";
    list.forEach(it=>{
      const row=document.createElement("div");row.className="row";
      const sp=document.createElement("span");sp.textContent=labelOf(it.file);
      const b=document.createElement("button");
      const inMenu=menu.includes(it.file);
      b.disabled=inMenu||menu.length>=MAX;b.textContent=inMenu?"追加済":"追加";
      b.onclick=()=>{if(menu.length<MAX&&!menu.includes(it.file)){menu.push(it.file);saveMenu(curClass,menu);renderEdit();}};
      row.appendChild(sp);row.appendChild(b);g.appendChild(row);
    });
    d.appendChild(g);wrap.appendChild(d);
  });
}

const fEl=document.getElementById("filter");
fEl.addEventListener("input",()=>{filterText=fEl.value;renderEdit();});

function openSheet(kind){
  const grid=document.getElementById("sheetGrid");grid.innerHTML="";
  document.getElementById("sheetTitle").textContent=kind==="timer"?"タイマー":"PV（曲）";
  DATA[kind].forEach(it=>{const a=document.createElement("a");a.href=it.url;a.target="_self";a.textContent=labelOf(it.file);grid.appendChild(a);});
  document.getElementById("overlay").classList.add("show");
}
function closeSheet(){document.getElementById("overlay").classList.remove("show");}

function setMode(e){
  editMode=e;
  document.getElementById("studentView").classList.toggle("hidden",e);
  document.getElementById("editView").classList.toggle("hidden",!e);
  document.getElementById("accessbar").classList.toggle("hidden",e);
  const bt=document.getElementById("editToggle");bt.textContent=e?"完了":"編集";bt.classList.toggle("on",e);
  if(e)renderEdit();else renderStudent();
}
document.getElementById("editToggle").onclick=()=>setMode(!editMode);
function renderAll(){renderTabs();if(editMode)renderEdit();else renderStudent();}
function sw(a,i,j){const t=a[i];a[i]=a[j];a[j]=t;}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
renderAll();
</script>
